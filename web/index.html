<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f0f0f">
    <title>Printer</title>
    <script src="theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="page" data-view="token" hidden>
      <form class="card token">
        <h2>Access token</h2>
        <p data-field="tokenMessage">This service needs its access token.</p>
        <label class="token__label">
          Token
          <input type="password" name="token" autocomplete="current-password" required>
        </label>
        <button type="submit" class="button">Connect</button>
      </form>
    </div>

    <main class="dash" data-view="dashboard">
      <div class="cam" data-field="camera" data-cam="loading">
        <img class="cam__img" data-field="cameraImage" alt="Live view of the print bed" hidden>
        <div class="cam__shade" aria-hidden="true"></div>
        <div class="cam__fail">
          <div class="cam__box">
            <span class="cam__title" data-field="cameraTitle"></span>
            <span class="cam__sub" data-field="cameraSub"></span>
            <button type="button" class="cam__retry" data-field="cameraRetry">Retry</button>
          </div>
        </div>
      </div>

      <header class="head">
        <h1 class="head__name" data-field="printerName">Centauri Carbon</h1>
        <span class="head__online" data-field="online" hidden><span class="head__dot" aria-hidden="true"></span>Online</span>
        <span class="head__offline" data-field="offline"><span class="head__ring" aria-hidden="true"></span>Offline</span>
        <button type="button" class="head__theme" data-field="themeToggle" aria-label="Switch to light theme" title="Switch to light theme"><span aria-hidden="true"></span></button>
      </header>

      <div class="sheet">
        <div class="page">
          <p class="notice" data-field="offlineNotice" role="alert" hidden></p>

          <section class="card" aria-labelledby="controls-heading">
            <h2 id="controls-heading">Controls</h2>
            <div class="controls">
              <button type="button" class="button" data-action="pause" disabled>Pause</button>
              <button type="button" class="button" data-action="resume" disabled>Resume</button>
              <button type="button" class="button button--danger" data-action="stop" disabled>Stop</button>
              <button type="button" class="button button--secondary" data-action="light" disabled>Light</button>
            </div>
            <p class="message" data-field="commandMessage" aria-live="polite"></p>
          </section>

          <section class="card" aria-labelledby="print-heading">
            <h2 id="print-heading">Print</h2>
            <dl class="fields">
              <div class="field"><dt>State</dt><dd data-field="printState">—</dd></div>
              <div class="field"><dt>Machine</dt><dd data-field="machineState">—</dd></div>
              <div class="field field--wide"><dt>File</dt><dd class="wrap" data-field="fileName">—</dd></div>
              <div class="field field--wide">
                <dt>Progress</dt>
                <dd>
                  <span data-field="progress">—</span>
                  <progress class="progress" max="100" value="0" data-field="progressBar" aria-label="Print progress"></progress>
                </dd>
              </div>
              <div class="field"><dt>Layer</dt><dd data-field="layer">—</dd></div>
              <div class="field"><dt>Elapsed</dt><dd data-field="elapsed">—</dd></div>
              <div class="field"><dt>Remaining</dt><dd data-field="remaining">—</dd></div>
              <div class="field" data-field="errorRow" hidden><dt>Error code</dt><dd data-field="errorCode">—</dd></div>
            </dl>
          </section>

          <section class="card" aria-labelledby="temps-heading">
            <h2 id="temps-heading">Temperatures</h2>
            <dl class="fields">
              <div class="field"><dt>Nozzle</dt><dd><span data-field="nozzle">—</span> <span class="muted" data-field="nozzleTarget"></span></dd></div>
              <div class="field"><dt>Bed</dt><dd><span data-field="bed">—</span> <span class="muted" data-field="bedTarget"></span></dd></div>
              <div class="field"><dt>Chamber</dt><dd><span data-field="chamber">—</span> <span class="muted" data-field="chamberTarget"></span></dd></div>
            </dl>
          </section>

          <footer class="footer">
            Last update: <time data-field="updatedAt">never</time>
          </footer>
        </div>
      </div>

      <dialog class="dialog" data-view="stopConfirm" aria-labelledby="stop-heading">
        <form method="dialog" class="dialog__form">
          <h2 id="stop-heading">Stop the print?</h2>
          <p>A stopped print can't be resumed.</p>
          <div class="controls">
            <button type="submit" class="button button--secondary" value="cancel" autofocus>Keep printing</button>
            <button type="submit" class="button button--danger" value="stop">Stop print</button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
