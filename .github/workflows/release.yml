name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches package.json version
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  release:
    name: create release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"

  image:
    name: publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z publishes X.Y.Z and latest; a prerelease (any '-') leaves latest alone.
      - name: Image tags
        id: tags
        env:
          IMAGE: ghcr.io/emmpaul/elegoo-centauri-carbon
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="$IMAGE:$version"
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest";; esac
          {
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  sbom:
    name: publish sbom
    needs: [release, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0
        id: syft

      # One SPDX JSON SBOM per platform, scanned from the digest this run pushed.
      - name: Generate and upload SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ghcr.io/emmpaul/elegoo-centauri-carbon@${{ needs.image.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          files=()
          for arch in amd64 arm64; do
            file="elegoo-centauri-carbon-$version-linux-$arch.spdx.json"
            "$SYFT" scan "registry:$IMAGE" --platform "linux/$arch" -o "spdx-json=$file"
            files+=("$file")
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
