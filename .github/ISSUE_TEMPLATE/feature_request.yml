name: Feature request
description: Suggest something the dashboard, controls, or notifications should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what's missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you picture it working, if you have one.
